<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor ESP32 - RSSI/dBm</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2D253F 0%, #1a1629 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .status.connected {
            background-color: rgba(169, 16, 33, 0.2);
            border: 1px solid #A91021;
            color: #ff6b7a;
        }

        .status.disconnected {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(45, 37, 63, 0.6);
            border: 1px solid rgba(169, 16, 33, 0.3);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(169, 16, 33, 0.2);
        }

        .card-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 300;
            color: #A91021;
        }

        .card-value.unit {
            font-size: 1.2rem;
            margin-left: 5px;
            opacity: 0.7;
        }

        .chart-container {
            background: rgba(45, 37, 63, 0.6);
            border: 1px solid rgba(169, 16, 33, 0.3);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            height: 400px;
            position: relative;
        }

        #rssiChart {
            max-height: 100%;
        }

        .info-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .card-value {
                font-size: 2rem;
            }

            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Monitor ESP32</h1>
            <div id="status" class="status disconnected">Conectando...</div>
        </header>

        <div class="dashboard">
            <div class="card">
                <div class="card-title">RSSI (dBm)</div>
                <div class="card-value" id="rssiValue">--</div>
            </div>
            <div class="card">
                <div class="card-title">Dispositivo</div>
                <div class="card-value" id="deviceValue" style="font-size: 1.5rem;">--</div>
            </div>
            <div class="card">
                <div class="card-title">Última Atualização</div>
                <div class="card-value" id="lastUpdate" style="font-size: 1.2rem;">--</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="rssiChart"></canvas>
        </div>
        <p class="info-text">Gráfico de RSSI em tempo real - Tempo x dBm</p>
    </div>

    <script>
        // Elementos DOM
        const statusEl = document.getElementById('status');
        const rssiValueEl = document.getElementById('rssiValue');
        const deviceValueEl = document.getElementById('deviceValue');
        const lastUpdateEl = document.getElementById('lastUpdate');

        // Configuração do gráfico
        const ctx = document.getElementById('rssiChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'RSSI (dBm)',
                    data: [],
                    borderColor: '#A91021',
                    backgroundColor: 'rgba(169, 16, 33, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    pointHoverBackgroundColor: '#A91021',
                    pointHoverBorderColor: '#ffffff',
                    pointHoverBorderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            color: 'rgba(255, 255, 255, 0.7)',
                            font: {
                                size: 12
                            }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(45, 37, 63, 0.95)',
                        titleColor: '#ffffff',
                        bodyColor: '#A91021',
                        borderColor: '#A91021',
                        borderWidth: 1,
                        padding: 12,
                        displayColors: false,
                        callbacks: {
                            label: function(context) {
                                return 'RSSI: ' + context.parsed.y + ' dBm';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: 'rgba(255, 255, 255, 0.5)',
                            maxTicksLimit: 10
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        }
                    },
                    y: {
                        beginAtZero: false,
                        grace: '10%',
                        ticks: {
                            color: 'rgba(255, 255, 255, 0.5)'
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        },
                        title: {
                            display: true,
                            text: 'dBm',
                            color: 'rgba(255, 255, 255, 0.7)'
                        }
                    }

                },
                animation: {
                    duration: 0
                }
            }
        });

        // Limitar dados no gráfico (últimos 60 pontos)
        const MAX_DATA_POINTS = 60;

        let eventSource = null;
        let pollInterval = null;

        // Função para atualizar dashboard
        function updateDashboard(data) {
            if (!data) return;

            // Atualiza valores
            if (data.rssi !== undefined) {
                rssiValueEl.textContent = data.rssi;
            }
            
            if (data.device) {
                deviceValueEl.textContent = data.device;
            }

            // Atualiza último update
            const now = new Date();
            lastUpdateEl.textContent = now.toLocaleTimeString('pt-BR');

            // Atualiza gráfico
            const timeLabel = now.toLocaleTimeString('pt-BR');
            chart.data.labels.push(timeLabel);
            chart.data.datasets[0].data.push(data.rssi);

            // Limita número de pontos no gráfico
            if (chart.data.labels.length > MAX_DATA_POINTS) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }

            chart.update('none');
        }

        // Função para atualizar status
        function updateStatus(mqttStatus) {
            if (mqttStatus && mqttStatus.connected) {
                statusEl.textContent = 'Conectado (MQTT OK)';
                statusEl.className = 'status connected';
            } else {
                statusEl.textContent = 'Aguardando MQTT...';
                statusEl.className = 'status disconnected';
            }
        }

        // Tenta usar Server-Sent Events primeiro
        function connectSSE() {
            try {
                eventSource = new EventSource('/api/stream');
                
                eventSource.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        
                        if (message.type === 'status') {
                            updateStatus(message.mqtt);
                        } else if (message.type === 'data' || message.rssi !== undefined) {
                            updateStatus(message.mqtt);
                            updateDashboard(message);
                        }
                    } catch (error) {
                        console.error('Erro ao processar mensagem SSE:', error);
                    }
                };

                eventSource.onerror = (error) => {
                    console.warn('Erro SSE, usando polling:', error);
                    eventSource.close();
                    connectPolling();
                };

                eventSource.onopen = () => {
                    console.log('✅ Conectado via Server-Sent Events');
                };

            } catch (error) {
                console.warn('SSE não suportado, usando polling:', error);
                connectPolling();
            }
        }

        // Fallback: Polling HTTP
        function connectPolling() {
            console.log('🔄 Usando polling HTTP');
            
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/data');
                    const result = await response.json();
                    
                    if (result.success) {
                        updateStatus(result.mqtt);
                        if (result.data) {
                            updateDashboard(result.data);
                        }
                    }
                } catch (error) {
                    console.error('Erro ao buscar dados:', error);
                    statusEl.textContent = 'Erro na conexão';
                    statusEl.className = 'status disconnected';
                }
            }, 1000); // Poll a cada 1 segundo

            // Primeira requisição imediata
            fetch('/api/data')
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        updateStatus(result.mqtt);
                        if (result.data) {
                            updateDashboard(result.data);
                        }
                    }
                })
                .catch(err => console.error('Erro inicial:', err));
        }

        // Inicia conexão quando a página carrega
        window.addEventListener('load', () => {
            console.log('🚀 Dashboard carregado');
            // Tenta SSE primeiro, fallback para polling
            connectSSE();
        });

        // Limpa conexões ao fechar a página
        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        });
    </script>
</body>
</html>
